name: Publicar Atalhos+

on:
  push:
    branches: ["main"]
    paths:
      - "atalhos-plus/**"
      - ".github/workflows/atalhos-plus-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "atalhos-plus"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
