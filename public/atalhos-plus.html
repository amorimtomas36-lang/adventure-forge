<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1b"><title>Atalhos+ para Android</title>
<style>
:root{--bg:#090f1b;--panel:#101c2d;--panel2:#15243a;--line:#22344b;--ink:#f3f7ff;--muted:#9eb0c7;--accent:#00c7a2;--accent2:#00a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:88px;background:radial-gradient(ellipse at 50% -20%,#17334d 0,transparent 45%)}.status{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:11px;font-weight:700;color:#e3ebf8}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#00c7a2,#007bff);display:grid;place-items:center;font-size:23px;box-shadow:0 5px 20px #008cff25}.top h1{font-size:24px;margin:0;letter-spacing:-.6px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:19px}.page{padding:0 16px}.search{display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:#101c2d;border-radius:14px;padding:0 13px;height:46px;margin-bottom:16px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;font-size:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 12px}.sectionhead h2{font-size:16px;margin:0;letter-spacing:-.2px}.muted{color:var(--muted);font-size:12px}.shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shortcut{border:1px solid #ffffff09;border-radius:17px;min-height:150px;padding:14px;background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 7px 20px #0002;transition:transform .16s}.shortcut:active{transform:scale(.98)}.shortcut .ico{height:43px;width:43px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:white;margin-bottom:11px}.shortcut b{font-size:13px;line-height:1.3}.shortcut p{font-size:11px;color:#d0def0;line-height:1.4;margin:5px 0 0}.shortcut .addsmall{margin-top:auto;align-self:flex-end;border:0;background:#ffffff12;color:white;border-radius:9px;width:28px;height:28px;font-size:19px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-top:11px}.panelrow{display:flex;align-items:center;gap:11px}.roundico{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#183a66;display:grid;place-items:center;font-size:19px}.panelrow .info{flex:1;min-width:0}.panelrow b{font-size:13px}.panelrow p{font-size:11px;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}.switch{width:42px;height:24px;border-radius:99px;background:#3b4c60;border:0;padding:3px;flex-shrink:0}.switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--accent2)}.switch.on:after{transform:translateX(18px)}.primary{border:0;background:linear-gradient(100deg,#008cff,#0068ff);color:white;border-radius:13px;height:46px;font-weight:750;width:100%;box-shadow:0 6px 18px #007bff24}.primary:active{transform:scale(.99)}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:10px 13px;font-size:12px;font-weight:650}.bottomnav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,780px);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#0b1422f2;border-top:1px solid #26364b;backdrop-filter:blur(18px)}.navbtn{border:0;background:transparent;color:#8196af;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:4px 0}.navbtn span{font-size:20px}.navbtn.active{color:var(--accent2)}.navbtn.active span{filter:drop-shadow(0 0 7px #00a8ff80)}.titlebar{display:flex;align-items:center;gap:12px;padding:6px 0 18px}.back{border:0;background:transparent;color:var(--ink);font-size:25px;width:28px;padding:0}.titlebar h2{font-size:19px;margin:0;flex:1}.field{display:block;color:#b4c6dc;font-size:12px;margin:14px 0}.field input,.field textarea,.field select{display:block;width:100%;margin-top:7px;background:#101c2d;border:1px solid #2a405a;color:var(--ink);border-radius:12px;padding:13px;outline:none}.field textarea{resize:vertical}.actionrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.actionrow .actionico{width:35px;height:35px;border-radius:10px;background:#183a66;display:grid;place-items:center;font-size:17px}.actionrow .actiontext{flex:1;min-width:0}.actionrow b{font-size:12px}.actionrow small{display:block;color:var(--muted);font-size:10px;margin-top:4px;overflow-wrap:anywhere}.actionrow button{border:0;background:transparent;color:#b4c6dc;font-size:19px}.pillrow{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:99px;font-size:11px}.pill.active{background:#007bff;color:white;border-color:#007bff}.browserpath{background:#101c2d;border:1px solid var(--line);border-radius:12px;padding:12px;color:#b4c6dc;font-size:11px;margin:8px 0}.folder{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border-bottom:1px solid #ffffff09}.folder:first-child{border-radius:13px 13px 0 0}.folder:last-child{border-radius:0 0 13px 13px}.folder .folderico{font-size:21px}.folder .folderinfo{flex:1}.folder b{font-size:12px}.folder small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.folder.selected{background:#103c68}.empty{border:1px dashed #2b3f57;color:var(--muted);padding:24px 15px;text-align:center;border-radius:14px;font-size:12px;margin-top:10px}.toast{position:fixed;z-index:50;bottom:92px;left:50%;transform:translateX(-50%);max-width:90vw;background:#e9f6ff;color:#102236;border-radius:12px;padding:12px 16px;font-size:12px;box-shadow:0 10px 30px #0006}.modalback{position:fixed;inset:0;z-index:30;background:#0009;display:grid;align-items:end;padding:14px}.modal{width:min(100%,520px);margin:auto;background:#101c2d;border:1px solid var(--line);border-radius:22px;padding:20px;max-height:85vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 8px}.modal p{font-size:12px;color:var(--muted);margin:0 0 12px}.filecontent{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;color:#c6d5e8;font-size:12px;line-height:1.5;background:#09111e;border-radius:12px;padding:12px}.hidden{display:none!important}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 2px}.setting{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.setting:last-child{border-bottom:0}.setting b{font-size:13px}.setting p{font-size:11px;color:var(--muted);margin-top:4px}@media(min-width:620px){.app{border-left:1px solid #ffffff05;border-right:1px solid #ffffff05;min-height:100vh}.shortcut-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.page{padding:0 22px}.top{padding-left:24px;padding-right:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app"><div class="status"><span id="clock">14:32</span><span>▴ ▪ ◉ ▰</span></div><header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Atalhos<span style="color:var(--accent)">+</span></h1><div class="sub">O teu Android, mais simples.</div></div></div><button class="iconbtn" id="topSettings" aria-label="Definições">⚙</button></header><main class="page" id="page"></main><nav class="bottomnav"><button class="navbtn active" data-tab="home"><span>⌂</span>Início</button><button class="navbtn" data-tab="automations"><span>◉</span>Automações</button><button class="navbtn" data-tab="gallery"><span>▧</span>Galeria</button><button class="navbtn" data-tab="settings"><span>⚙</span>Definições</button></nav></div><div id="overlay"></div><script>
const $=s=>document.querySelector(s), page=$('#page'), overlay=$('#overlay');
const colors=['#087dff','#762cff','#00a96b','#ff7800','#ed0875','#263d59','#08a6aa','#b23cff'];
const catalog=[
{id:'organize',name:'Organizar Ficheiros',desc:'Move, copia e organiza os teus ficheiros',icon:'📁',color:colors[0],actions:[['📂','Selecionar pasta','Escolhe uma pasta'],['▱','Criar pasta','Android/Organizados'],['⇄','Mover ficheiros','Para a pasta criada'],['✎','Renomear ficheiros','Adicionar data ao nome']]},
{id:'cache',name:'Limpar Cache',desc:'Apaga ficheiros temporários e cache',icon:'▤',color:colors[1],actions:[['▤','Ver armazenamento','Consultar espaço disponível'],['⌫','Selecionar ficheiros','Escolher ficheiros para apagar']]},
{id:'images',name:'Converter Imagens',desc:'Converte imagens para outros formatos',icon:'▧',color:colors[2],actions:[['▧','Selecionar imagens','JPG, PNG, WebP'],['⇩','Escolher formato','Formato de destino']]},
{id:'zip',name:'Compactar Pasta',desc:'Cria um ficheiro ZIP da pasta escolhida',icon:'▧',color:colors[3],actions:[['📂','Selecionar pasta','Escolher pasta de origem'],['▣','Criar arquivo ZIP','Guardar o ZIP no destino']]},
{id:'rename',name:'Renomear em Lote',desc:'Renomeia vários ficheiros de uma vez',icon:'✎',color:colors[4],actions:[['▧','Selecionar ficheiros','Escolher vários ficheiros'],['✎','Definir nomes','Prefixo ou padrão']]},
{id:'location',name:'Abrir Localização',desc:'Abre uma pasta no explorador',icon:'⌖',color:colors[6],actions:[['📂','Escolher pasta','Abrir seletor de pastas']]},
{id:'note',name:'Criar Nota',desc:'Guarda uma nota rápida no Atalhos+',icon:'▤',color:colors[7],actions:[['✎','Escrever nota','Guardar localmente']]},
{id:'website',name:'Abrir Site',desc:'Abre uma página web',icon:'◎',color:'#007de8',actions:[['◎','Introduzir endereço','Abrir site HTTP ou HTTPS']]}
];
let shortcuts=load('ap-shortcuts',[]), notes=load('ap-notes',[]), autos=load('ap-autos',[
{id:'app',name:'Quando abrir o app',detail:'10 ações',enabled:true,condition:'Ao abrir o Atalhos+'},
{id:'charge',name:'Quando ligar o carregador',detail:'3 ações',enabled:false,condition:'Ao ligar o carregador'},
{id:'wifi',name:'Quando conectar ao Wi-Fi',detail:'4 ações',enabled:false,condition:'Ao conectar ao Wi-Fi'},
{id:'time',name:'Quando chegar a hora',detail:'2 ações',enabled:false,condition:'À hora escolhida'}]);
let tab='home', search='', draft=null, fileContent='Escolhe um ficheiro para visualizar o seu conteúdo.', fileName='', selectedFolder='/storage/emulated/0';
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function toast(t){overlay.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>{if($('.toast'))overlay.innerHTML=''},2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(t){tab=t;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function head(title,sub=''){return '<div class="titlebar"><button class="back" onclick="go(\'home\')">‹</button><h2>'+title+'</h2></div>'+(sub?'<p class="hint">'+sub+'</p>':'')}
function card(x,plus=false){return '<article class="shortcut"><div class="ico" style="background:'+x.color+'">'+x.icon+'</div><b>'+esc(x.name)+'</b><p>'+esc(x.desc)+'</p><button class="addsmall" onclick="'+(plus?'addCatalog(\''+x.id+'\')':'executeShortcut(\''+x.id+'\')')+'">'+(plus?'＋':'↗')+'</button></article>'}
function render(){
if(tab==='home'){page.innerHTML='<div class="search">⌕ <input id="search" placeholder="Procurar atalhos..." value="'+esc(search)+'"></div><div class="sectionhead"><h2>Os meus atalhos</h2><span class="muted">'+shortcuts.length+' atalhos</span></div>'+(shortcuts.length?'<div class="shortcut-grid">'+shortcuts.filter(x=>(x.name+x.desc).toLowerCase().includes(search.toLowerCase())).map(x=>card(x)).join('')+'</div>':'<div class="empty">Ainda não tens atalhos.<br>Vai à Galeria e adiciona os teus primeiros.</div>')+'<div class="sectionhead"><h2>Acesso rápido</h2><span class="muted">Atalhos+ offline</span></div><div class="panel"><div class="panelrow"><div class="roundico">📂</div><div class="info"><b>Selecionar ficheiros</b><p>Escolhe ficheiros usando o seletor seguro do Android.</p></div><button class="secondary" onclick="openFilePicker()">Abrir</button></div></div><div class="panel"><div class="panelrow"><div class="roundico">📝</div><div class="info"><b>Notas guardadas</b><p>'+notes.length+' notas guardadas neste navegador.</p></div><button class="secondary" onclick="showNotes()">Ver</button></div></div>';
$('#search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};
}else if(tab==='gallery'){page.innerHTML=head('Galeria de Atalhos','Escolhe atalhos prontos e adiciona-os à tua página inicial.')+'<div class="search">⌕ <input id="gallerySearch" placeholder="Procurar na galeria..."></div><div class="pillrow"><button class="pill active" data-filter="Todos">Tudo</button><button class="pill" data-filter="Ficheiros">Ficheiros</button><button class="pill" data-filter="Imagem">Imagem</button><button class="pill" data-filter="Sistema">Sistema</button></div><div class="gallerygrid shortcut-grid">'+catalog.map(x=>card(x,true)).join('')+'</div>';
$('#gallerySearch').oninput=e=>{$$('.gallerygrid .shortcut').forEach((el,i)=>el.classList.toggle('hidden',!(catalog[i].name+catalog[i].desc).toLowerCase().includes(e.target.value.toLowerCase())))};
$$('.pill').forEach(b=>b.onclick=()=>{$$('.pill').forEach(x=>x.classList.toggle('active',x===b));$$('.gallerygrid .shortcut').forEach((el,i)=>el.classList.toggle('hidden',b.dataset.filter!=='Todos'&&!((b.dataset.filter==='Ficheiros'&&['organize','cache','zip','rename','location'].includes(catalog[i].id))||(b.dataset.filter==='Imagem'&&['images'].includes(catalog[i].id))||(b.dataset.filter==='Sistema'&&['website','note'].includes(catalog[i].id))))});
}else if(tab==='automations'){page.innerHTML=head('Automações','Executa atalhos com base em condições. A execução em segundo plano depende das permissões do Android.')+autos.map(a=>'<div class="panel"><div class="panelrow"><div class="roundico">◉</div><div class="info"><b>'+esc(a.name)+'</b><p>'+esc(a.detail)+'</p></div><button class="switch '+(a.enabled?'on':'')+'" aria-label="Ativar automação" onclick="toggleAuto(\''+a.id+'\')"></button></div></div>').join('')+'<div style="margin-top:17px"><button class="primary" onclick="newAuto()">＋ Criar Automação</button></div><p class="hint">Nota: num site/PWA, automações não conseguem vigiar outros apps, Wi-Fi ou carregador quando estão fechadas. Para isso é necessária uma app Android nativa com permissões do sistema.</p>';
}else if(tab==='settings'){page.innerHTML=head('Definições','Personaliza a experiência do Atalhos+.')+'<div class="panel"><div class="setting"><div><b>Tema</b><p>Interface escura</p></div><span class="muted">Escuro</span></div><div class="setting"><div><b>Guardar dados</b><p>Atalhos e notas neste navegador</p></div><button class="secondary" onclick="exportData()">Exportar</button></div><div class="setting"><div><b>Importar dados</b><p>Restaurar um backup JSON</p></div><button class="secondary" onclick="importData()">Importar</button></div><div class="setting"><div><b>Sobre o Atalhos+</b><p>Versão de pré-visualização · Android</p></div><span style="color:var(--accent)">v0.2</span></div></div><p class="hint">Esta versão é uma pré-visualização web. O navegador limita operações diretas sobre cache, ficheiros de outras apps e automações em segundo plano.</p>';
}else if(tab==='builder'){page.innerHTML=head('Criar Atalho','Escolhe um nome e adiciona ações. Algumas ações abrem seletores Android; operações protegidas dependem das permissões disponíveis.')+'<label class="field">Nome do atalho<input id="shortcutName" value="'+esc(draft?.name||'')+'" placeholder="Ex.: Organizar Ficheiros"></label><div class="sectionhead"><h2>Ações</h2><span class="muted">'+(draft?.actions.length||0)+' ações</span></div>'+(draft?.actions||[]).map((a,i)=>'<div class="actionrow"><div class="actionico">'+a.icon+'</div><div class="actiontext"><b>'+esc(a.name)+'</b><small>'+esc(a.detail)+'</small></div><button onclick="removeAction('+i+')">×</button></div>').join('')+'<button class="primary" style="margin-top:13px" onclick="addActionMenu()">＋ Adicionar Ação</button><p class="hint">As ações são executadas na ordem indicada. Esta versão web só pode executar as ações que o navegador permite.</p><button class="primary" style="margin-top:9px" onclick="saveDraft()">✓ Guardar Atalho</button>';
}else if(tab==='organizer'){page.innerHTML=head('Organizar Ficheiros','Seleciona os ficheiros e pastas que queres usar. O seletor é fornecido pelo Android.')+'<div class="browserpath">⌁　'+esc(selectedFolder)+'　›</div><div class="panel"><p class="hint">O navegador não pode listar livremente todo o armazenamento do telemóvel. Toca em selecionar para conceder acesso aos ficheiros escolhidos.</p><button class="primary" onclick="openFilePicker()">📂 Selecionar ficheiros/pasta</button><div id="pickedFiles"></div></div><div class="sectionhead"><h2>Ficheiros selecionados</h2></div><div id="fileList" class="empty">Nenhum ficheiro selecionado.</div>';
}else if(tab==='notes'){page.innerHTML=head('Notas guardadas','As notas ficam guardadas localmente neste navegador.')+'<button class="primary" onclick="newNote()">＋ Criar Nota</button>'+ (notes.length?notes.map((n,i)=>'<div class="panel"><div class="panelrow"><div class="roundico">📝</div><div class="info"><b>'+esc(n.text.slice(0,70))+'</b><p>'+esc(n.date||'Nota guardada')+'</p></div><button class="secondary" onclick="deleteNote('+i+')">Apagar</button></div></div>').join(''):'<div class="empty">Ainda não tens notas guardadas.</div>');
}}
function $$(s){return [...document.querySelectorAll(s)]}
function addCatalog(id){const x=catalog.find(c=>c.id===id);if(!x)return;if(shortcuts.some(s=>s.sourceId===id)){toast('Este atalho já está na tua página inicial.');return}shortcuts.push({...x,id:'s'+Date.now(),sourceId:id});save('ap-shortcuts',shortcuts);toast('Atalho adicionado!');go('home')}
function executeShortcut(id){const x=shortcuts.find(s=>s.id===id);if(!x)return;if(x.sourceId==='organize'){go('organizer');return}if(x.sourceId==='note'){newNote();return}if(x.sourceId==='website'){const u=prompt('Endereço do site:');if(u){let url=u.match(/^https?:\/\//)?u:'https://'+u;try{const p=new URL(url);if(!['http:','https:'].includes(p.protocol))throw 0;window.open(p.href,'_blank','noopener,noreferrer')}catch{toast('Endereço inválido.')}}return}if(x.sourceId==='cache'){toast('O Android não permite limpar a cache de outras apps através do navegador.');return}if(x.sourceId==='images'){openFilePicker();return}if(x.sourceId==='zip'){toast('Criar ZIP diretamente requer uma implementação nativa ou biblioteca adicional.');return}if(x.sourceId==='rename'){openFilePicker();return}if(x.sourceId==='location'){go('organizer');return}if(x.sourceId==='ff'){location.href='intent://#Intent;package=com.dts.freefireth;end';return}if(x.actions?.length){draft={...x,actions:[...x.actions]};tab='builder';render();return}toast('Abre o atalho para ver as ações configuradas.')}
function addActionMenu(){const options=['Selecionar ficheiros','Selecionar pasta','Criar pasta','Mover ficheiros','Copiar ficheiros','Renomear ficheiros','Abrir site','Criar nota','Escolher imagens','Mostrar notificação'];const choice=prompt('Escolhe uma ação (escreve o nome):\n'+options.map((x,i)=>(i+1)+'. '+x).join('\n'));if(!choice)return;let i=Number(choice)-1;let name=options[i]||choice.trim();let map={'Selecionar ficheiros':['▧','Selecionar ficheiros','Escolher ficheiros pelo seletor Android'],'Selecionar pasta':['📂','Selecionar pasta','Escolher uma pasta'],'Criar pasta':['📁','Criar pasta','Criar dentro de uma pasta autorizada'],'Mover ficheiros':['⇄','Mover ficheiros','Mover ficheiros selecionados'],'Copiar ficheiros':['▣','Copiar ficheiros','Copiar ficheiros selecionados'],'Renomear ficheiros':['✎','Renomear ficheiros','Alterar o nome de ficheiros'],'Abrir site':['◎','Abrir site','Abrir um endereço HTTP/HTTPS'],'Criar nota':['📝','Criar nota','Guardar uma nota local'],'Escolher imagens':['▧','Escolher imagens','Abrir seletor de imagens'],'Mostrar notificação':['♧','Mostrar notificação','Mostrar mensagem enquanto a página está aberta']};let a=map[name]||['⚡',name,'Ação personalizada'];draft.actions.push({icon:a[0],name:a[1],detail:a[2]});render()}
function removeAction(i){draft.actions.splice(i,1);render()}
function saveDraft(){const name=$('#shortcutName').value.trim();if(!name){toast('Escreve o nome do atalho.');return}const obj={...draft,id:draft.id||'s'+Date.now(),name,desc:draft.desc||'Atalho personalizado',icon:draft.icon||'⚡',color:draft.color||'#007bff',sourceId:draft.sourceId||'custom'};const idx=shortcuts.findIndex(s=>s.id===obj.id);if(idx>=0)shortcuts[idx]=obj;else shortcuts.push(obj);save('ap-shortcuts',shortcuts);draft=null;toast('Atalho guardado.');go('home')}
function toggleAuto(id){autos=autos.map(a=>a.id===id?{...a,enabled:!a.enabled}:a);save('ap-autos',autos);render();toast('Estado atualizado.')}
function newAuto(){const name=prompt('Nome da automação (ex.: Quando abrir o app):');if(!name)return;autos.push({id:'a'+Date.now(),name,detail:'0 ações',enabled:false,condition:name});save('ap-autos',autos);render();toast('Automação criada. A execução em segundo plano requer app nativa.')}
function openFilePicker(){const input=document.createElement('input');input.type='file';input.multiple=true;input.onchange=async()=>{const files=[...(input.files||[])];if(!files.length)return;fileName=files[0].name;try{fileContent=await files[0].text()}catch{fileContent='Não foi possível ler este ficheiro.'}tab='organizer';render();const list=$('#fileList');if(list)list.innerHTML=files.map(f=>'<div class="folder"><span class="folderico">📄</span><div class="folderinfo"><b>'+esc(f.name)+'</b><small>'+Math.round(f.size/1024)+' KB</small></div></div>').join('');toast(files.length+' ficheiro(s) selecionado(s).');};input.click()}
function newNote(){const text=prompt('Escreve a tua nota:');if(text===null||!text.trim())return;notes.unshift({text:text.trim(),date:new Date().toLocaleString('pt-PT')});save('ap-notes',notes);toast('Nota guardada.');go('notes')}
function deleteNote(i){notes.splice(i,1);save('ap-notes',notes);render()}
function showNotes(){go('notes')}
function exportData(){const blob=new Blob([JSON.stringify({shortcuts,notes,autos},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atalhos-plus-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(d.shortcuts)shortcuts=d.shortcuts;if(d.notes)notes=d.notes;if(d.autos)autos=d.autos;save('ap-shortcuts',shortcuts);save('ap-notes',notes);save('ap-autos',autos);toast('Backup importado.');render()}catch{toast('Ficheiro de backup inválido.')}};i.click()}
$('#topSettings').onclick=()=>go('settings');$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('#clock').textContent=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});render();
</script></body></html>
